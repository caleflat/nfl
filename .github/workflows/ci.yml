name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nfl
          POSTGRES_PASSWORD: local_nfl
          POSTGRES_DB: nfl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfl -d nfl_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://nfl:local_nfl@localhost:5432/nfl_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Verify Compose startup
        run: |
          docker compose up -d --build --wait
          curl --fail-with-body http://127.0.0.1:8080/healthz
          status=$(curl -sS -o /tmp/summary-response.json -w '%{http_code}' 'http://127.0.0.1:8080/api/v1/summary?season=2025&team=NE&down=3')
          test "$status" = 404
          jq -e '.error.code == "season_unavailable"' /tmp/summary-response.json
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop Compose services
        if: always()
        run: docker compose down
