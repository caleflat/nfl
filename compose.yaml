services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: nfl
      POSTGRES_PASSWORD: local_nfl
      POSTGRES_DB: nfl
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl -d nfl"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
